<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1014">
<meta name="mobile-web-app-capable" content="yes">
<title>Bandmate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="song-name" id="songName" title="Rename">Untitled</button>
    <div class="top-actions">
      <button class="ibtn" id="btnLib" title="Library"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg></button>
      <button class="ibtn" id="btnSave" title="Save"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg></button>
      <button class="ibtn txt" id="btnMidi" title="Export MIDI">MIDI</button>
    </div>
  </header>

  <section class="transport">
    <button class="tbtn" id="btnRew" title="To start"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-10 7 10 7z" class="fill"/></svg></button>
    <button class="tbtn play" id="btnPlay" title="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4l13 8-13 8z" class="fill"/></svg></button>
    <button class="tbtn tog" id="btnLoop" title="Loop section"><svg viewBox="0 0 24 24"><path d="M4 12a6 6 0 016-6h9l-3-3M20 12a6 6 0 01-6 6H5l3 3"/></svg></button>
    <button class="tbtn tog" id="btnClick" title="Metronome"><svg viewBox="0 0 24 24"><path d="M9 3h6l3 18H6z"/><path d="M12 15l5-9"/></svg></button>
    <button class="tbtn tog" id="btnEdit" title="Edit mode: tap a chord to change it"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
    <div class="lcd">
      <div class="lcd-row">
        <span class="lcd-pos" id="lcdPos">1.1</span>
        <span class="lcd-chord" id="lcdChord">–</span>
      </div>
      <div class="lcd-sub"><button class="lcd-bpm" id="btnTempo" title="Change tempo">♩ <span id="lcdBpm">110</span> ✎</button> <span id="lcdSig">4/4</span> · <span id="lcdKey">C Major</span></div>
    </div>
  </section>

  <main id="views">
    <!-- ARRANGE -->
    <div class="view" id="view-arrange">
      <div class="arr-tools">
        <div class="seg" id="secTools">
          <span class="hint" id="secHint">Tap a section or chord</span>
        </div>
        <div class="zoom">
          <button class="pill" id="btnStruct" title="Edit song structure">✎ Song</button>
          <button class="ibtn sm" id="zoomOut">−</button>
          <button class="ibtn sm" id="zoomIn">+</button>
          <button class="ibtn sm tog on" id="btnFollow" title="Follow playhead"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="arr">
        <div class="arr-heads" id="arrHeads"></div>
        <div class="arr-scroll" id="arrScroll"><div class="arr-inner" id="arrInner"><canvas id="arrCanvas"></canvas></div></div>
      </div>
      <div class="info-strip" id="infoStrip"></div>
    </div>

    <!-- CHART -->
    <div class="view" id="view-chart">
      <div class="stage">
        <div class="stage-now"><small>NOW</small><b id="stNow">–</b><span id="stNowSub"></span></div>
        <div class="stage-next"><small>NEXT</small><b id="stNext">–</b><span id="stNextSub"></span></div>
        <div class="stage-meta"><span id="stSec">–</span><div class="beats" id="stBeats"></div></div>
      </div>
      <div class="chart-opts">
        <div class="chips" id="chartMode">
          <button data-v="name" class="on">Chords</button><button data-v="rn">Roman</button><button data-v="nash">Nashville</button>
        </div>
        <button class="ibtn txt" id="btnCopyChart">Copy</button>
      </div>
      <div class="chart" id="chartBody"></div>
    </div>

    <!-- KEY -->
    <div class="view scroll" id="view-key"></div>

    <!-- MIXER -->
    <div class="view scroll" id="view-mix"></div>

    <!-- GENERATE -->
    <div class="view scroll" id="view-gen"></div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="gen"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg><span>Generate</span></button>
    <button data-view="arrange" class="on"><svg viewBox="0 0 24 24"><path d="M3 6h8M13 6h8M3 12h12M17 12h4M3 18h5M10 18h11"/></svg><span>Arrange</span></button>
    <button data-view="chart"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 10h16M4 15h16M12 4v16"/></svg><span>Chart</span></button>
    <button data-view="key"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM8 5v9M12 5v9M16 5v9M8 14v5M12 14v5M16 14v5"/></svg><span>Key</span></button>
    <button data-view="mix"><svg viewBox="0 0 24 24"><path d="M6 3v18M12 3v18M18 3v18"/><path d="M4 15h4M10 8h4M16 13h4"/></svg><span>Mixer</span></button>
  </nav>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <div class="sheet-head"><b id="modalTitle">Library</b><button class="ibtn" id="modalClose">✕</button></div>
    <div class="sheet-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
